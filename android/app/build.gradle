plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.topmts.report'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.topmts.report'
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName '2.1.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'topmts2026'
            keyAlias 'topmts'
            keyPassword 'topmts2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
